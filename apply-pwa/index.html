<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社内申請アプリ</title>
<link rel="manifest" href="./manifest.json">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #1a73e8; --primary-dark: #1557b0;
  --danger: #e53935; --success: #43a047; --warn: #fb8c00;
  --bg: #f5f7fa; --card: #fff; --border: #e0e0e0;
  --text: #212121; --text-sub: #757575; --radius: 8px;
}
body { font-family: 'Segoe UI','Helvetica Neue',sans-serif; background: var(--bg); color: var(--text); }

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ログイン */
#screen-login { justify-content: center; align-items: center; background: linear-gradient(135deg,#1a73e8,#0d47a1); }
.login-card { background: var(--card); border-radius: 16px; padding: 40px 32px; width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
.login-card h1 { font-size: 20px; text-align: center; margin-bottom: 8px; }
.login-card p  { font-size: 13px; color: var(--text-sub); text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; }
.form-group input:focus { outline: none; border-color: var(--primary); }
.btn-primary { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-primary:hover { background: var(--primary-dark); }
.login-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; display: none; }

/* ヘッダー */
.app-header { background: var(--primary); color: #fff; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.app-header h1 { font-size: 18px; font-weight: 700; }
.header-user { font-size: 13px; display: flex; align-items: center; gap: 8px; }
.btn-logout { background: rgba(255,255,255,.2); border: none; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btn-refresh { background: rgba(255,255,255,.2); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .3s; }
.btn-refresh:active { transform: rotate(180deg); }

/* タブ */
.tab-nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab-btn { flex: 1; min-width: 80px; padding: 12px 8px; border: none; background: none; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: color .2s, border-color .2s; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

.tab-content { display: none; padding: 16px; }
.tab-content.active { display: block; }

/* カード */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); cursor: pointer; }
.card:active { opacity: .8; }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.card-sub   { font-size: 13px; color: var(--text-sub); }

/* バッジ */
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 700; }
.badge-申請中  { background: #fff3e0; color: var(--warn); }
.badge-承認済  { background: #e8f5e9; color: var(--success); }
.badge-否認   { background: #ffebee; color: var(--danger); }
.badge-取下げ  { background: #f5f5f5; color: var(--text-sub); }
/* 届出アプリの7ステータス。本人にボールがある状態（書類待ち・差し戻し）は目立たせる */
.badge-受付済   { background: #e3f2fd; color: #1565c0; }
.badge-書類待ち { background: #fff3e0; color: #e65100; font-weight: 700; }
.badge-差し戻し { background: #ffebee; color: var(--danger); font-weight: 700; }
.badge-対応中   { background: #ede7f6; color: #5e35b1; }
.badge-完了     { background: #e8f5e9; color: var(--success); }
.badge-取り下げ { background: #f5f5f5; color: var(--text-sub); }
/* 処理中のボタン（連打防止が効いていることが見た目でわかるように） */
button:disabled { opacity: .55; cursor: progress; }
/* 届出：期日の表示 */
.td-due-soon { background:#fff3e0; border:1px solid #ffcc80; color:#e65100; padding:8px 10px; border-radius:8px; font-size:13px; margin-top:8px; }
.td-due-over { background:#ffebee; border:1px solid #ef9a9a; color:#c62828; padding:8px 10px; border-radius:8px; font-size:13px; margin-top:8px; }
.td-guide    { background:#f1f8e9; border-left:3px solid #8bc34a; padding:8px 10px; border-radius:4px; font-size:13px; white-space:pre-wrap; margin:8px 0; }
.td-names    { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.td-names label { display:flex; align-items:flex-start; gap:8px; cursor:pointer; font-weight:400; margin:0; }

/* FAB */
.fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 16px rgba(26,115,232,.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
.fab:hover { transform: scale(1.08); }

/* モーダル */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; justify-content: center; align-items: flex-end; }
.modal-overlay.open { display: flex; }
#modal-confirm { z-index: 210; }
.modal { background: var(--card); border-radius: 16px 16px 0 0; padding: 24px; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-header h2 { font-size: 17px; font-weight: 700; }
.btn-close { background: none; border: none; font-size: 22px; color: var(--text-sub); cursor: pointer; }
.modal label { font-size: 13px; font-weight: 600; display: block; margin-top: 14px; }
.modal select, .modal input[type=text], .modal input[type=date],
.modal input[type=number], .modal textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 14px; margin-top: 4px; font-family: inherit;
}
.modal textarea { resize: vertical; min-height: 80px; }
.modal select:focus, .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--primary); }
.modal-footer { margin-top: 20px; display: flex; gap: 8px; }
.btn-cancel { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: none; font-size: 14px; cursor: pointer; }
.btn-submit { flex: 2; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-danger { flex: 1; padding: 12px; background: var(--danger); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; }
.btn-success { flex: 1; padding: 12px; background: var(--success); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700; cursor: pointer; }

/* 詳細行 */
.detail-row { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.detail-label { color: var(--text-sub); font-size: 13px; min-width: 110px; }
.detail-val { font-size: 14px; flex: 1; }

/* 明細テーブル */
.detail-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.detail-table th { background: #f0f4ff; padding: 6px 8px; text-align: left; border: 1px solid var(--border); }
.detail-table td { padding: 6px 8px; border: 1px solid var(--border); }
.detail-table input { width: 100%; border: none; background: none; font-size: 13px; font-family: inherit; }
.detail-table input:focus { outline: 1px solid var(--primary); border-radius: 4px; }

/* 交通費精算の明細：列が潰れて入力中の文字が見えなくなるのを防ぐ（親divのoverflow-x:autoで横スクロール） */
#transport-rows-table { min-width: 790px; }
#transport-rows-table th:nth-child(1), #transport-rows-table td:nth-child(1) { width: 160px; }
#transport-rows-table th:nth-child(2), #transport-rows-table td:nth-child(2) { width: 160px; }
#transport-rows-table th:nth-child(3), #transport-rows-table td:nth-child(3) { width: 110px; }
#transport-rows-table th:nth-child(4), #transport-rows-table td:nth-child(4) { width: 110px; }
#transport-rows-table th:nth-child(5), #transport-rows-table td:nth-child(5) { width: 90px; }
#transport-rows-table th:nth-child(6), #transport-rows-table td:nth-child(6) { width: 120px; }
/* 枠なし入力だと入力欄の位置が分かりづらいので下線を付ける */
#transport-rows-table input { border-bottom: 1px solid var(--border); border-radius: 0; padding: 3px 2px; }
#transport-rows-table input:focus { outline: none; border-bottom: 2px solid var(--primary); background: #f5f9ff; }
.btn-add-row { margin-top: 8px; padding: 6px 14px; border: 1px dashed var(--border); background: none; border-radius: var(--radius); font-size: 13px; cursor: pointer; color: var(--text-sub); }
.btn-del-row { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; }

/* ローディング */
.loading { text-align: center; padding: 40px; color: var(--text-sub); font-size: 14px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; padding: 60px 20px; color: var(--text-sub); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 12px 20px; border-radius: var(--radius); font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 300; white-space: nowrap; }
.toast.show { opacity: 1; }

.rejection-box { margin-top: 12px; padding: 12px; background: #ffebee; border-radius: var(--radius); }
.rejection-box .label { font-size: 13px; color: var(--danger); font-weight: 700; }
.rejection-box .val { font-size: 14px; margin-top: 4px; }

/* 絞り込みバー */
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0; }
.filter-bar select, .filter-bar input[type=date] {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; background: var(--card); color: var(--text); flex: 1; min-width: 120px;
}
.filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--primary); }
.btn-filter-clear {
  padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius);
  background: none; font-size: 13px; cursor: pointer; color: var(--text-sub); white-space: nowrap;
}
.btn-filter-clear:hover { background: var(--bg); }
.bulk-bar { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
.bulk-bar button { padding: 8px 16px; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 700; cursor: pointer; color: #fff; }
.pending-card { display: flex; gap: 10px; align-items: flex-start; }
.pending-card input[type=checkbox] { margin-top: 14px; width: 18px; height: 18px; flex-shrink: 0; }
.pending-card .card { flex: 1; margin-bottom: 0; }
.pending-item { margin-bottom: 12px; }
</style>
</head>
<body>

<!-- ログイン -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <h1>📋 社内申請アプリ</h1>
    <p>社員番号とPINコードでログイン</p>
    <div class="form-group">
      <label>社員番号</label>
      <input type="text" id="inp-empid" placeholder="例: 1001" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>PINコード</label>
      <input type="password" id="inp-pin" placeholder="4桁" inputmode="numeric" maxlength="4">
    </div>
    <button class="btn-primary" onclick="doLogin()">ログイン</button>
    <div class="login-error" id="login-error"></div>
    <button onclick="location.href='../'" style="margin-top:14px;background:none;border:none;color:var(--primary);font-size:14px;cursor:pointer;text-decoration:underline">← スケジュールに戻る</button>
  </div>
</div>

<!-- メイン -->
<div id="screen-main" class="screen">
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:10px">
      <button onclick="location.href='../'" title="スケジュールに戻る" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap">← スケジュール</button>
      <h1>📋 社内申請</h1>
    </div>
    <div class="header-user">
      <span id="header-username"></span>
      <button class="btn-refresh" onclick="refreshCurrentTab()" title="更新">↻</button>
      <button class="btn-logout" onclick="doLogout()">ログアウト</button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="mine"    onclick="switchTab('mine')">自分の申請</button>
    <button class="tab-btn" data-tab="pending" onclick="switchTab('pending')" id="tab-pending-btn" style="display:none">要承認<span id="pending-badge" style="display:none;background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;margin-left:4px;"></span></button>
    <button class="tab-btn" data-tab="all"     onclick="switchTab('all')"     id="tab-all-btn"     style="display:none">全申請</button>
    <button class="tab-btn" data-tab="todoke"  onclick="switchTab('todoke')"  id="tab-todoke-btn"  style="display:none">届出対応</button>
  </nav>

  <div id="tab-mine" class="tab-content active">
    <div id="mine-summary" style="display:none;background:var(--card);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);gap:16px;flex-wrap:wrap;"></div>
    <div class="filter-bar" id="mine-filter-bar">
      <select id="mine-filter-type" onchange="applyMineFilter()">
        <option value="">すべての種別</option>
        <option value="leave">🌴 休暇申請</option>
        <option value="transport">🚃 交通費精算</option>
        <option value="expense">💴 出張費精算</option>
        <option value="other">📝 その他</option>
        <option value="todoke">📨 届出・相談</option>
      </select>
      <select id="mine-filter-status" onchange="applyMineFilter()">
        <option value="">すべてのステータス</option>
        <option value="申請中">申請中</option>
        <option value="承認済">承認済</option>
        <option value="受付済">受付済</option>
        <option value="書類待ち">書類待ち</option>
        <option value="差し戻し">差し戻し</option>
        <option value="対応中">対応中</option>
        <option value="完了">完了</option>
        <option value="取り下げ">取り下げ</option>
        <option value="否認">否認</option>
        <option value="取下げ">取下げ</option>
      </select>
      <button class="btn-filter-clear" onclick="clearMineFilter()">クリア</button>
      <span id="mine-filter-count" style="font-size:13px;color:var(--text-sub);"></span>
    </div>
    <div id="list-mine"><div class="loading"><div class="spinner"></div><div>読み込み中...</div></div></div>
  </div>
  <div id="tab-pending" class="tab-content">
    <div id="pending-bulk-bar" class="bulk-bar" style="display:none;">
      <button onclick="doBulkApprove()" style="background:var(--success);">一括承認</button>
      <span id="pending-bulk-count" style="font-size:13px;color:var(--text-sub);"></span>
    </div>
    <div id="list-pending"><div class="loading"><div class="spinner"></div><div>読み込み中...</div></div></div>
  </div>
  <div id="tab-all" class="tab-content">
    <!-- 絞り込みフィルター -->
    <div class="filter-bar">
      <select id="filter-type" onchange="applyFilter()">
        <option value="">すべての種別</option>
        <option value="leave">🌴 休暇申請</option>
        <option value="transport">🚃 交通費精算</option>
        <option value="expense">💴 出張費精算</option>
        <option value="other">📝 その他</option>
        <option value="todoke">📨 届出・相談</option>
      </select>
      <select id="filter-status" onchange="applyFilter()">
        <option value="">すべてのステータス</option>
        <option value="申請中">申請中</option>
        <option value="承認済">承認済</option>
        <option value="否認">否認</option>
        <option value="取下げ">取下げ</option>
      </select>
      <input type="text" id="filter-name" oninput="applyFilter()" placeholder="名前で絞り込み">
      <div style="display:flex;align-items:center;gap:4px;flex-wrap:nowrap;">
        <span style="font-size:12px;color:var(--text-sub);white-space:nowrap;">期間</span>
        <input type="date" id="filter-from" onchange="applyFilter()">
        <span style="font-size:12px;color:var(--text-sub);">〜</span>
        <input type="date" id="filter-to"   onchange="applyFilter()">
      </div>
      <button class="btn-filter-clear" onclick="clearFilter()">クリア</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0 8px;">
      <div id="filter-count" style="font-size:13px;color:var(--text-sub);"></div>
      <button onclick="exportCSV()" style="padding:6px 12px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer;">⬇ CSV出力</button>
    </div>
    <div id="list-all"><div class="loading"><div class="spinner"></div><div>読み込み中...</div></div></div>
  </div>

  <!-- 届出対応タブ（総務＝HR_VIEWERS のみ表示） -->
  <div id="tab-todoke" class="tab-content">
    <div class="filter-bar">
      <select id="td-filter-major" onchange="onTodokeMajorFilterChange()">
        <option value="">すべての大分類</option>
      </select>
      <select id="td-filter-apply" onchange="applyTodokeFilter()">
        <option value="">すべての申請名</option>
      </select>
      <select id="td-filter-status" onchange="applyTodokeFilter()">
        <option value="">対応中のものすべて</option>
        <option value="申請中">申請中</option>
        <option value="受付済">受付済</option>
        <option value="書類待ち">書類待ち</option>
        <option value="差し戻し">差し戻し</option>
        <option value="対応中">対応中</option>
        <option value="完了">完了（見返し）</option>
        <option value="取り下げ">取り下げ（見返し）</option>
        <option value="__all">すべて（完了・取り下げを含む）</option>
      </select>
      <input type="text" id="td-filter-name" oninput="applyTodokeFilter()" placeholder="名前で絞り込み">
      <select id="td-filter-due" onchange="onTodokeDueFilterChange()">
        <option value="">すべての期日</option>
        <option value="over">期日超過</option>
        <option value="week">7日以内（超過を含む）</option>
        <option value="range">期間を指定</option>
      </select>
      <div id="td-filter-range" style="display:none;align-items:center;gap:4px;flex-wrap:nowrap;">
        <input type="date" id="td-filter-from" onchange="applyTodokeFilter()">
        <span style="font-size:12px;color:var(--text-sub);">〜</span>
        <input type="date" id="td-filter-to" onchange="applyTodokeFilter()">
      </div>
      <select id="td-sort" onchange="applyTodokeFilter()">
        <option value="due-asc">期日が近い順</option>
        <option value="due-desc">期日が遠い順</option>
        <option value="applied-desc">申請日が新しい順</option>
        <option value="applied-asc">申請日が古い順</option>
      </select>
      <button class="btn-filter-clear" onclick="clearTodokeFilter()">クリア</button>
    </div>
    <div id="td-filter-count" style="font-size:13px;color:var(--text-sub);padding:4px 0 8px;"></div>
    <div id="list-todoke"><div class="loading"><div class="spinner"></div><div>読み込み中...</div></div></div>
  </div>

  <button class="fab" onclick="openNewModal()" title="新規申請">＋</button>
</div>

<!-- 新規申請モーダル -->
<div class="modal-overlay" id="modal-new">
  <div class="modal">
    <div class="modal-header">
      <h2>新規申請</h2>
      <button class="btn-close" onclick="closeModal('modal-new')">✕</button>
    </div>
    <label>申請種別</label>
    <select id="new-type" onchange="renderNewFields()">
      <option value="">選択してください</option>
      <option value="expense">💴 出張費精算</option>
      <option value="transport">🚃 交通費精算</option>
      <option value="other">📝 その他申請</option>
      <option value="change">📝 従業員情報変更届</option>
      <option value="todoke">📨 届出・相談</option>
      <option id="opt-onboarding" value="onboarding" hidden>🎉 新入社員 入社登録</option>
    </select>
    <div id="new-type-fields"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('modal-new')">キャンセル</button>
      <button class="btn-submit" onclick="submitNew()">申請する</button>
    </div>

<div class="modal-overlay" id="modal-detail">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detail-title">申請詳細</h2>
      <button class="btn-close" onclick="closeModal('modal-detail')">✕</button>
    </div>
    <div id="detail-body"></div>
    <div class="modal-footer" id="detail-footer"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================================================
// 設定
// ===================================================
const GAS_URL      = 'https://script.google.com/macros/s/AKfycbwvHJ12cwnKgWIwrAXAeXuv1wSZXQXOHdAxhZ_P7vbe7KhrtEwv1wCigz0IHocrgHg/exec';
const PHOTO_GAS_URL = 'https://script.google.com/macros/s/AKfycbwp8eTk9iDA3hPVuUrgwqBPr7UfFcWrFrXsfXcCR1eUo_siMsWahjSgxnU7LMjWRtM/exec';

// ===================================================
// セッション
// ===================================================
let currentUser = null;
let applyPerms = {};   // GASから取得する申請アプリ内の権限 { canViewAll, isHrViewer }
let currentToken = null;
let onboardingEligible = null; // 入社登録メニュー表示可否（起動時に取得してキャッシュ）

const APPROVAL_DEPT_ALIAS = {
  '事務': '製造',
  '設計': '製造',
  '検査': '製造',
};
function _canApproveApply(r) {
  if (r.approverEmpId) return String(r.approverEmpId) === String(currentUser.id);
  const role = currentUser.role || '';
  if (role && role !== '一般' && role !== '主任') return true;
  const effectiveDept = APPROVAL_DEPT_ALIAS[r.applicantDept] || r.applicantDept;
  return role === '主任' && currentUser.dept === effectiveDept;
}

function saveSession(token, user) {
  currentToken = token;
  currentUser = user;
  localStorage.setItem('apply_session', JSON.stringify({ token, user, expires: Date.now() + 8 * 60 * 60 * 1000 }));
}
function loadSession() {
  try {
    // 申請アプリ独自のセッション
    const d = JSON.parse(localStorage.getItem('apply_session') || 'null');
    if (d && Date.now() <= d.expires) {
      currentToken = d.token;
      currentUser  = d.user;
      return true;
    }
    // スケジュールアプリのセッションを流用（同一オリジンでlocalStorageを共有）
    const s = JSON.parse(localStorage.getItem('sch_sess') || 'null');
    if (s && s.token && s.user && (!s.expires || Date.now() <= s.expires)) {
      currentToken = s.token;
      currentUser  = s.user;
      return true;
    }
    return false;
  } catch { return false; }
}
function doLogout() {
  localStorage.removeItem('apply_session');
  currentToken = currentUser = null;
  showScreen('login');
}

// ===================================================
// 画面・タブ
// ===================================================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  loadTab(name);
}
function refreshCurrentTab() {
  const active = document.querySelector('.tab-btn.active');
  if (active) loadTab(active.dataset.tab);
}

// ===================================================
// GAS通信（POST）
// ===================================================
let _reloginPromise = null;

async function gas(payload, _retryCount, _sessionRetried) {
  if (!GAS_URL) throw new Error('GAS URLが未設定です。index.html の GAS_URL を設定してください');
  const attempt = _retryCount || 0;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  let res;
  try {
    res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      redirect: 'follow',
      signal: ctrl.signal,
    });
  } catch (e) {
    clearTimeout(timer);
    if (attempt < 2) {
      await new Promise(r => setTimeout(r, 1500));
      return gas(payload, attempt + 1, _sessionRetried);
    }
    if (e.name === 'AbortError') throw new Error('サーバー応答がタイムアウトしました');
    throw new Error('通信エラー: ' + (e.message || 'ネットワークに接続できません'));
  }
  clearTimeout(timer);
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch {
    if (attempt < 2) {
      await new Promise(r => setTimeout(r, 1500));
      return gas(payload, attempt + 1);
    }
    throw new Error('サーバーから不正な応答がありました（HTML）。GASの再デプロイが必要な可能性があります');
  }
  if (!json.ok) {
    if (json.error === 'SESSION_EXPIRED' && !_sessionRetried) {
      localStorage.removeItem('apply_session');
      await _showReloginDialog();
      payload.token = currentToken;
      return gas(payload, 0, true);
    }
    throw new Error(json.error || '通信エラー');
  }
  return json.data;
}

function _showReloginDialog() {
  if (_reloginPromise) return _reloginPromise;
  _reloginPromise = new Promise((resolve, reject) => {
    const overlay = document.createElement('div');
    overlay.id = 'relogin-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    const empVal = currentUser?.id || '';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:28px 24px;max-width:320px;width:100%;text-align:center">
        <div style="font-size:2em;margin-bottom:10px">⏱️</div>
        <h3 style="margin:0 0 8px;font-size:1.05em">セッションが切れました</h3>
        <p style="color:#666;font-size:0.85em;margin:0 0 16px">再ログインすると操作を続けられます</p>
        <input id="relogin-empid" type="text" inputmode="numeric" value="${empVal}" placeholder="社員番号" style="width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:0.95em;margin-bottom:8px;box-sizing:border-box">
        <input id="relogin-pin" type="password" inputmode="numeric" placeholder="PIN" style="width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:0.95em;margin-bottom:4px;box-sizing:border-box">
        <p id="relogin-error" style="color:#e53e3e;font-size:0.82em;display:none;margin:4px 0 0"></p>
        <button id="relogin-btn" style="width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:0.95em;font-weight:600;cursor:pointer;margin-top:12px">ログイン</button>
        <button id="relogin-cancel" style="width:100%;padding:8px;background:none;border:none;color:#666;font-size:0.82em;cursor:pointer;margin-top:4px">ログアウトする</button>
      </div>`;
    document.body.appendChild(overlay);
    const empIn = document.getElementById('relogin-empid');
    const pinIn = document.getElementById('relogin-pin');
    empVal ? pinIn.focus() : empIn.focus();
    const _doRelogin = async () => {
      const empId = empIn.value.trim(), pin = pinIn.value.trim();
      const errEl = document.getElementById('relogin-error');
      if (!empId || !pin) { errEl.textContent = '社員番号とPINを入力してください'; errEl.style.display = 'block'; return; }
      const btn = document.getElementById('relogin-btn');
      btn.disabled = true; btn.textContent = 'ログイン中...';
      try {
        const ctrl = new AbortController();
        const tmr = setTimeout(() => ctrl.abort(), 45000);
        const r = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'login', empId, pin }), redirect: 'follow', signal: ctrl.signal }).catch(fe => {
          if (fe.name === 'AbortError') throw new Error('サーバー応答がタイムアウトしました');
          throw fe;
        });
        clearTimeout(tmr);
        const txt = await r.text();
        let data;
        try { data = JSON.parse(txt); } catch { throw new Error('サーバーから不正な応答がありました。しばらく待ってからお試しください'); }
        if (!data.ok) throw new Error(data.error || 'ログインに失敗しました');
        saveSession(data.data.token, data.data.user);
        _reloginPromise = null;
        overlay.remove();
        resolve();
      } catch (e) {
        errEl.textContent = e.message.includes('LOCKED') ? 'アカウントがロックされています' : 'ログインに失敗しました';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'ログイン';
        pinIn.value = ''; pinIn.focus();
      }
    };
    document.getElementById('relogin-btn').addEventListener('click', _doRelogin);
    pinIn.addEventListener('keydown', e => { if (e.key === 'Enter') _doRelogin(); });
    empIn.addEventListener('keydown', e => { if (e.key === 'Enter') pinIn.focus(); });
    document.getElementById('relogin-cancel').addEventListener('click', () => {
      _reloginPromise = null;
      overlay.remove();
      doLogout();
      reject(new Error('SESSION_EXPIRED'));
    });
  });
  return _reloginPromise;
}

// ===================================================
// ログイン
// ===================================================
async function doLogin() {
  const empId = document.getElementById('inp-empid').value.trim();
  const pin   = document.getElementById('inp-pin').value.trim();
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!empId || !pin) { errEl.textContent = '社員番号とPINを入力してください'; errEl.style.display = 'block'; return; }
  try {
    const data = await gas({ action: 'login', empId, pin });
    saveSession(data.token, data.user);
    initMain();
  } catch (e) {
    errEl.textContent = e.message.includes('LOCKED') ? 'アカウントがロックされています' : e.message;
    errEl.style.display = 'block';
  }
}

// ===================================================
// メイン初期化
// ===================================================
function initMain() {
  document.getElementById('header-username').textContent = currentUser.name;
  const canApprove = currentUser.isAdmin || (currentUser.role && currentUser.role !== '一般');
  document.getElementById('tab-pending-btn').style.display = canApprove ? '' : 'none';
  // 全申請タブは HR_VIEWERS(88,100) / DEV_VIEWERS のみ。
  // 管理者フラグでは出さない（2026-10-16）。権限はGAS側に問い合わせる。
  document.getElementById('tab-all-btn').style.display = 'none';
  document.getElementById('tab-todoke-btn').style.display = 'none';
  gas({ action: 'getApplyPerms', token: currentToken })
    .then(p => {
      applyPerms = p || {};
      document.getElementById('tab-all-btn').style.display = applyPerms.canViewAll ? '' : 'none';
      // 届出対応タブは総務（HR_VIEWERS）だけ。個人情報を含むため管理者フラグでは出さない
      document.getElementById('tab-todoke-btn').style.display = applyPerms.canViewAll ? '' : 'none';
    })
    .catch(() => { /* 取得できなければ非表示のまま */ });
  showScreen('main');
  loadTab('mine');
  // 一般社員でも承認者に指名されていればタブを出す（交通費精算を総務が承認するケース）
  loadPendingBadge();
  refreshOnboardingEligibility(); // 起動時に先読みしてキャッシュ（モーダルを開いたとき即表示するため）
  _openTodokeFromUrl();
}

// 通知やHALOマイページから ?todoke=届出ID 付きで開かれたら、その届出の詳細を開く。
// 開いたらURLからパラメータを消す（リロードで何度も開かないように）。
function _openTodokeFromUrl() {
  try {
    const params = new URLSearchParams(location.search);
    const id = params.get('todoke');
    if (!id) return;
    params.delete('todoke');
    const q = params.toString();
    history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
    openTodokeDetail(id);
  } catch (e) { /* URLが読めなければ何もしない */ }
}

// 入社登録メニューの表示可否をキャッシュに反映（DOMがあれば即適用）
function _applyOnboardingOptionVisibility() {
  const optOb = document.getElementById('opt-onboarding');
  if (optOb) optOb.hidden = (onboardingEligible !== true);
}
async function refreshOnboardingEligibility() {
  try {
    const r = await gas({ action: 'getOnboardingEligible', token: currentToken });
    onboardingEligible = !!(r && r.eligible);
  } catch {
    onboardingEligible = false;
  }
  _applyOnboardingOptionVisibility();
}

async function loadPendingBadge() {
  try {
    const data = await gas({ action: 'getApplyPending', token: currentToken });
    const count = data.count || 0;
    updatePendingBadge(count);
    // 役職が一般でも承認者に指名された申請があればタブを出す
    if (count > 0) document.getElementById('tab-pending-btn').style.display = '';
  } catch {}
}

// ===================================================
// タブ読み込み
// ===================================================
let mineRecordsCache = [];
let allRecordsCache = [];
let approverData = null;
let _loadTabSeq = 0;

async function loadTab(name) {
  const seq = ++_loadTabSeq;
  const el = document.getElementById('list-' + name);
  el.innerHTML = '<div class="loading"><div class="spinner"></div><div>読み込み中...</div></div>';
  if (name === 'mine') document.getElementById('mine-summary').style.display = 'none';
  try {
    let records = [];
    if (name === 'todoke') {
      await loadTodokeTab();
      return;
    } else if (name === 'mine') {
      const [applyAll, expenses, todokes] = await Promise.all([
        gas({ action: 'getApplyAll', token: currentToken }),
        gas({ action: 'getExpenses', token: currentToken }).catch(() => []), // scope省略=自分の申請のみ
        gas({ action: 'getTodokeList', token: currentToken }).catch(() => []),
      ]);
      if (seq !== _loadTabSeq) return;
      records = [
        ...((applyAll && applyAll.leave)  || []).map(r => ({ ...r, _appType: 'leave' })),
        ...((applyAll && applyAll.other)  || []).map(r => ({ ...r, _appType: 'other' })),
        ...((applyAll && applyAll.transport) || []).map(r => ({ ...r, _appType: 'transport' })),
        ...(expenses || []).map(r => ({ ...r, _appType: 'expense' })),
        // 届出はステータス名もフィールド名も違うので、カード描画が読む形に合わせる
        ...(todokes || []).map(r => ({
          ...r, _appType: 'todoke',
          approvalStatus:  r.status,
          applicationDate: (r.appliedAt || '').slice(0, 10),
        })),
      ];
      const summaryEl = document.getElementById('mine-summary');
      const counts = { '申請中': 0, '承認済': 0, '否認': 0, '取下げ': 0 };
      records.forEach(r => { if (counts[r.approvalStatus] !== undefined) counts[r.approvalStatus]++; });
      summaryEl.style.display = 'flex';
      summaryEl.innerHTML = [
        { label: '申請中', color: 'var(--warn)',    key: '申請中' },
        { label: '承認済', color: 'var(--success)', key: '承認済' },
        { label: '否認',   color: 'var(--danger)',  key: '否認'   },
      ].map(({ label, color, key }) =>
        `<div style="text-align:center;min-width:60px;">
          <div style="font-size:22px;font-weight:700;color:${color};">${counts[key]}</div>
          <div style="font-size:12px;color:var(--text-sub);">${label}</div>
        </div>`
      ).join('<div style="width:1px;background:var(--border);"></div>');
      records.sort((a, b) => { const ka = _sortKey(a), kb = _sortKey(b); return kb > ka ? 1 : kb < ka ? -1 : 0; });
      mineRecordsCache = records;
      applyMineFilter();
      return;
    } else if (name === 'pending') {
      const [applyAll, expenses] = await Promise.all([
        gas({ action: 'getApplyForApprovalAll', token: currentToken }),
        // 管理者フラグではなく scope='pending' でGAS側が「自分が承認者の申請中」だけを返す（2026-10-16）
        gas({ action: 'getExpenses', token: currentToken, scope: 'pending' }).catch(() => []),
      ]);
      if (seq !== _loadTabSeq) return;
      records = [
        ...((applyAll && applyAll.leave)  || []).map(r => ({ ...r, _appType: 'leave' })),
        ...((applyAll && applyAll.other)  || []).map(r => ({ ...r, _appType: 'other' })),
        ...((applyAll && applyAll.transport) || []).map(r => ({ ...r, _appType: 'transport' })),
        ...(expenses || []).filter(r => r.approvalStatus === '申請中').map(r => ({ ...r, _appType: 'expense' })),
      ];
      updatePendingBadge(records.filter(r => r.approvalStatus === '申請中').length);
    } else if (name === 'all') {
      const [applyAll, expenses] = await Promise.all([
        gas({ action: 'getApplyAll', token: currentToken, scope: 'all' }),
        gas({ action: 'getExpenses', token: currentToken, scope: 'all' }).catch(() => []),
      ]);
      if (seq !== _loadTabSeq) return;
      records = [
        ...((applyAll && applyAll.leave)  || []).map(r => ({ ...r, _appType: 'leave' })),
        ...((applyAll && applyAll.other)  || []).map(r => ({ ...r, _appType: 'other' })),
        ...((applyAll && applyAll.transport) || []).map(r => ({ ...r, _appType: 'transport' })),
        ...(expenses || []).map(r => ({ ...r, _appType: 'expense' })),
      ];
      records.sort((a, b) => { const ka = _sortKey(a), kb = _sortKey(b); return kb > ka ? 1 : kb < ka ? -1 : 0; });
      allRecordsCache = records;
      applyFilter();
      return;
    }
    records.sort((a, b) => { const ka = _sortKey(a), kb = _sortKey(b); return kb > ka ? 1 : kb < ka ? -1 : 0; });
    renderList(el, records, name === 'pending' ? { checkbox: true } : undefined);
  } catch (e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>${esc(e.message)}</p></div>`;
  }
}

// ===================================================
// 自分の申請タブ絞り込み
// ===================================================
function applyMineFilter() {
  const typeVal   = document.getElementById('mine-filter-type').value;
  const statusVal = document.getElementById('mine-filter-status').value;
  let filtered = mineRecordsCache.filter(r => {
    if (typeVal   && r._appType !== typeVal) return false;
    if (statusVal && r.approvalStatus !== statusVal) return false;
    return true;
  });
  document.getElementById('mine-filter-count').textContent =
    (typeVal || statusVal) ? `${filtered.length} / ${mineRecordsCache.length} 件` : '';
  renderList(document.getElementById('list-mine'), filtered);
}

function clearMineFilter() {
  document.getElementById('mine-filter-type').value   = '';
  document.getElementById('mine-filter-status').value = '';
  applyMineFilter();
}

function updatePendingBadge(count) {
  const badge = document.getElementById('pending-badge');
  if (!badge) return;
  badge.textContent = count;
  badge.style.display = count > 0 ? 'inline' : 'none';
}

// ===================================================
// 全申請タブ絞り込み
// ===================================================
function applyFilter() {
  const typeVal   = document.getElementById('filter-type').value;
  const statusVal = document.getElementById('filter-status').value;
  const nameVal   = (document.getElementById('filter-name').value || '').trim();
  const fromVal   = document.getElementById('filter-from').value;
  const toVal     = document.getElementById('filter-to').value;

  let filtered = allRecordsCache.filter(r => {
    if (typeVal   && r._appType !== typeVal) return false;
    if (statusVal && r.approvalStatus !== statusVal) return false;
    if (nameVal   && !(r.applicantName || '').includes(nameVal)) return false;
    const dateStr = r.applicationDate || r.appliedAt || '';
    if (fromVal && dateStr && dateStr < fromVal) return false;
    if (toVal   && dateStr && dateStr > toVal)   return false;
    return true;
  });

  const countEl = document.getElementById('filter-count');
  countEl.textContent = `${filtered.length} 件`;

  renderList(document.getElementById('list-all'), filtered);
}

function clearFilter() {
  document.getElementById('filter-type').value   = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-name').value   = '';
  document.getElementById('filter-from').value   = '';
  document.getElementById('filter-to').value     = '';
  applyFilter();
}

function elapsedDays(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days === 0) return '今日';
  return `${days}日経過`;
}

function renderList(el, records, opts) {
  const showCheckbox = opts && opts.checkbox;
  if (!records.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>申請はありません</p></div>';
    if (showCheckbox) { document.getElementById('pending-bulk-bar').style.display = 'none'; }
    return;
  }
  if (showCheckbox) {
    document.getElementById('pending-bulk-bar').style.display = 'flex';
    updateBulkCount();
  }
  el.innerHTML = records.map(r => {
    const elapsed = r.approvalStatus === '申請中'
      ? elapsedDays(r.createdAt || r.applicationDate) : '';
    const cardHtml = `
    <div class="card" onclick="openDetail('${esc(r._appType)}','${esc(r.id)}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="card-title">${typeIcon(r._appType)} ${typeLabel(r._appType)}</div>
          <div class="card-sub">${esc(r.applicantName || r.applicantId)} ・ ${esc(r.applicationDate || r.appliedAt || '')}</div>
          ${r._appType === 'expense' ? `<div class="card-sub">行先: ${esc(r.destination || '')}　計 ${Number(r.totalAmount || 0).toLocaleString()} 円</div>` : ''}
          ${r._appType !== 'expense' && r.content ? (() => { try { const c = JSON.parse(r.content); if (r._appType === 'transport') { return `<div class="card-sub">${esc(c.destination || '')} ${esc(c.periodStart||'')}〜${esc(c.periodEnd||'')} 計 ${Number(c.totalAmount||0).toLocaleString()} 円</div>`; } const timeInfo = c.allDay === false && c.startTime ? ` ${esc(c.startTime)}〜${esc(c.endTime)}` : c.allDay !== undefined ? ' 終日' : ''; return `<div class="card-sub">${esc(c.title || '')}${c.start ? esc(c.start) + '〜' + esc(c.end) + timeInfo : ''}</div>`; } catch { return ''; } })() : ''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <span class="badge badge-${esc(r.approvalStatus)}">${esc(r.approvalStatus)}</span>
          ${elapsed ? `<span style="font-size:11px;color:var(--text-sub);">${elapsed}</span>` : ''}
        </div>
      </div>
    </div>`;
    if (showCheckbox && r.approvalStatus === '申請中' && r._appType !== 'expense') {
      return `<div class="pending-item"><div class="pending-card">
        <input type="checkbox" class="bulk-cb" data-apptype="${esc(r._appType)}" data-id="${esc(r.id)}" onchange="updateBulkCount()">
        ${cardHtml}
      </div></div>`;
    }
    return showCheckbox ? `<div class="pending-item">${cardHtml}</div>` : cardHtml;
  }).join('');
}

async function openDetail(appType, id) {
  // 届出はステータス体系が違う（承認/却下ではなく受付→対応→完了）ので専用の詳細へ
  if (appType === 'todoke') return openTodokeDetail(id);
  document.getElementById('detail-body').innerHTML = '<div class="loading"><div class="spinner"></div><div>読み込み中...</div></div>';
  document.getElementById('detail-footer').innerHTML = '';
  document.getElementById('detail-title').textContent = typeIcon(appType) + ' ' + typeLabel(appType) + ' 詳細';
  openModal('modal-detail');

  try {
    let r;
    if (appType === 'expense') {
      r = await gas({ action: 'getExpenseById', token: currentToken, expenseId: id });
      if (!r) throw new Error('申請が見つかりません');
      renderExpenseDetail(r);
    } else {
      r = await gas({ action: 'getApplyById', token: currentToken, appType, recordId: id });
      if (!r) throw new Error('申請が見つかりません');
      renderApplyDetail(appType, r);
    }

    // 承認できるかはサーバーの判定（r.canApprove）に従う。古いGASで返ってこないときだけ従来の役職判定。
    // （2026-10-27 テストで、総務に出張費の承認ボタンが出ない・申請した本人に出る食い違いが見つかった）
    const canApprove = (typeof r.canApprove === 'boolean') ? r.canApprove : _canApproveApply(r);
    const isOwn = r.applicantId === currentUser.id;
    const footer = document.getElementById('detail-footer');
    footer.innerHTML = '';

    if (r.approvalStatus === '申請中') {
      if (canApprove) {
        const rejectBtn = document.createElement('button');
        rejectBtn.className = 'btn-danger';
        rejectBtn.textContent = '却下';
        rejectBtn.onclick = () => doReject(appType, r.id, rejectBtn);
        const approveBtn = document.createElement('button');
        approveBtn.className = 'btn-success';
        approveBtn.textContent = '承認';
        approveBtn.onclick = () => doApprove(appType, r.id, approveBtn);
        footer.appendChild(rejectBtn);
        footer.appendChild(approveBtn);
      }
      if (isOwn && appType !== 'expense') {
        const editBtn = document.createElement('button');
        editBtn.className = 'btn-submit';
        editBtn.textContent = '編集';
        editBtn.onclick = () => editApply(appType, r);
        footer.appendChild(editBtn);
      }
      if (isOwn) {
        const withdrawBtn = document.createElement('button');
        withdrawBtn.className = 'btn-cancel';
        withdrawBtn.textContent = '取下げ';
        withdrawBtn.onclick = () => doWithdraw(appType, r.id, withdrawBtn);
        footer.appendChild(withdrawBtn);
      }
    }
    if (isOwn && appType !== 'expense') {
      const reuseBtn = document.createElement('button');
      reuseBtn.className = 'btn-cancel';
      reuseBtn.textContent = '再利用';
      reuseBtn.onclick = () => reuseApply(appType, r);
      footer.appendChild(reuseBtn);
    }
    if (isOwn && r.approvalStatus === '否認' && appType !== 'expense') {
      const reApplyBtn = document.createElement('button');
      reApplyBtn.className = 'btn-submit';
      reApplyBtn.textContent = '再申請';
      reApplyBtn.onclick = () => reApply(appType, r);
      footer.appendChild(reApplyBtn);
    }
    if (appType === 'expense') {
      const pdfBtn = document.createElement('button');
      pdfBtn.className = 'btn-cancel';
      pdfBtn.textContent = '🖨 PDF出力';
      pdfBtn.onclick = () => printExpensePDF(r);
      footer.appendChild(pdfBtn);
    }
    if (appType === 'transport') {
      const pdfBtn = document.createElement('button');
      pdfBtn.className = 'btn-cancel';
      pdfBtn.textContent = '🖨 PDF出力';
      pdfBtn.onclick = () => printTransportPDF(r);
      footer.appendChild(pdfBtn);
    }
  } catch (e) {
    document.getElementById('detail-body').innerHTML = `<div class="empty"><p>読み込み失敗: ${esc(e.message)}</p></div>`;
  }
}

// ===================================================
// 承認・却下・取下げ
// ===================================================
// 詳細モーダルのボタン共通の連打防止。
// 押したボタンを「○○中...」にして、フッターのボタンを全部無効化する。
// 成功時はモーダルを閉じるので戻さない。失敗して開いたままなら押し直せるように戻す。
let _detailBusy = false;
async function _runDetailAction(btn, busyLabel, fn) {
  if (_detailBusy) return;
  _detailBusy = true;
  const footer   = document.getElementById('detail-footer');
  const siblings = footer ? Array.from(footer.querySelectorAll('button')) : [];
  const prevText = btn ? btn.textContent : '';
  siblings.forEach(b => { b.disabled = true; });
  if (btn) btn.textContent = busyLabel || '処理中...';
  try {
    await fn();
  } finally {
    _detailBusy = false;
    if (document.getElementById('modal-detail').classList.contains('open')) {
      siblings.forEach(b => { b.disabled = false; });
      if (btn) btn.textContent = prevText;
    }
  }
}

async function doApprove(appType, id, btn) {
  // 確認ダイアログは無効化する前に出す（キャンセルされたらそのまま戻る）
  const comment = prompt('承認コメント（任意）', '');
  if (comment === null) return;
  await _runDetailAction(btn, '承認中...', async () => {
    try {
      if (appType === 'expense') await gas({ action: 'approveExpense', token: currentToken, expenseId: id });
      else await gas({ action: 'approveApply', token: currentToken, appType, recordId: id, comment: comment.trim() });
      closeModal('modal-detail');
      showToast('承認しました');
      loadTab('pending');
    } catch (e) { showToast('失敗: ' + e.message); }
  });
}

function exportCSV() {
  if (!allRecordsCache.length) { showToast('エクスポートするデータがありません'); return; }
  const header = ['申請種別', '申請者', 'ステータス', '申請日', '承認者', 'コメント', '詳細'];
  const rows = allRecordsCache.map(r => {
    let detail = '';
    try {
      const c = JSON.parse(r.content || '{}');
      detail = Object.values(c).join(' / ');
    } catch { detail = r.destination || ''; }
    return [
      typeLabel(r._appType),
      r.applicantName || r.applicantId || '',
      r.approvalStatus || '',
      r.applicationDate || r.appliedAt || '',
      r.approverName || r.approverEmpId || '',
      r.approverComment || '',
      detail,
    ];
  });
  const csv = [header, ...rows].map(row =>
    row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')
  ).join('\r\n');
  const bom = '﻿';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '申請一覧_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

async function doReject(appType, id, btn) {

  await _runDetailAction(btn, '却下中...', async () => {
    try {
      if (appType === 'expense') await gas({ action: 'rejectExpense', token: currentToken, expenseId: id, reason });
      else await gas({ action: 'rejectApply', token: currentToken, appType, recordId: id, reason });
      closeModal('modal-detail');
      showToast('却下しました');
      loadTab('pending');
    } catch (e) { showToast('失敗: ' + e.message); }
  });
}

async function doWithdraw(appType, id, btn) {
  if (!confirm('この申請を取り下げますか？\n取り下げ後も履歴として残ります。')) return;
  await _runDetailAction(btn, '取下げ中...', async () => {
    try {

      showToast('取り下げました');

    } catch (e) { showToast('失敗: ' + e.message); }

}

async function _fillFormFromRecord(appType, r) {
  try {
    const c = JSON.parse(r.content || '{}');
    if (appType === 'leave') {
      if (c.start) document.getElementById('f-leave-start').value = c.start;
      if (c.end)   document.getElementById('f-leave-end').value   = c.end;
      if (c.note)  document.getElementById('f-leave-note').value  = c.note;
      if (c.allDay === false) {
        document.getElementById('f-leave-allday').checked = false;
        toggleLeaveTime();
        if (c.startTime) document.getElementById('f-leave-start-time').value = c.startTime;
        if (c.endTime)   document.getElementById('f-leave-end-time').value   = c.endTime;
      }
    } else if (appType === 'other') {
      if (c.title) document.getElementById('f-other-title').value = c.title;
      if (c.body)  document.getElementById('f-other-body').value  = c.body;
    } else if (appType === 'transport') {
      if (c.periodStart) document.getElementById('f-tr-period-start').value = c.periodStart;
      if (c.periodEnd)   document.getElementById('f-tr-period-end').value   = c.periodEnd;
      if (c.destination)  document.getElementById('f-tr-dest').value        = c.destination;
      const rows = document.getElementById('transport-rows');
      if (c.details && c.details.length) {
        rows.innerHTML = '';
        c.details.forEach(d => {
          addTransportRow();
          const tr = rows.lastElementChild;
          const s = (f, v) => { const el = tr.querySelector(`[data-f="${f}"]`); if (el && v) el.value = v; };
          s('dateFrom', d.dateFrom || d.date); // 旧形式（単一date）との後方互換
          s('dateTo',   d.dateTo   || d.date);
          s('facility', d.facility);
          s('from',     d.from);
          s('to',       d.to);
          s('amount',   d.amount);
          s('memo',     d.memo);
        });
        calcTransportTotal();
      }
    }
    if (r.approverEmpId) {
      const sel = document.getElementById('f-approver-id');
      if (sel) sel.value = r.approverEmpId;
    }
  } catch {}
}

async function doBulkApprove() {
  const checks = document.querySelectorAll('.bulk-cb:checked');
  if (!checks.length) { showToast('承認する申請を選択してください'); return; }
  const comment = prompt(`${checks.length}件を一括承認します。コメント（任意）`, '');
  if (comment === null) return;
  let ok = 0, fail = 0;
  for (const cb of checks) {
    try {
      await gas({ action: 'approveApply', token: currentToken, appType: cb.dataset.apptype, recordId: cb.dataset.id, comment: comment.trim() });
      ok++;
    } catch { fail++; }
  }
  showToast(`${ok}件 承認${fail ? `、${fail}件 失敗` : ''}`);
  loadTab('pending');
}

function getApproverSectionHTML(appType) {
  if (!approverData) return '<div style="margin-top:14px;padding:10px;background:#fff3e0;border-radius:8px;font-size:13px;color:#e65100;">⚠ 承認者情報の取得に失敗しました。<button onclick="_loadApproverData()" style="margin-left:8px;padding:4px 12px;border:1px solid #e65100;border-radius:6px;background:#fff;color:#e65100;cursor:pointer;font-size:12px;">再取得</button></div>';
  let candidates;
  if (appType === 'transport') {
    // 交通費精算は総務が窓口のため、組織名に「総務」を含む全員（役職不問）
    const warn = msg => `<label>承認者 <span style="color:var(--danger)">*</span></label><div style="padding:10px;background:#fff3e0;border-radius:8px;font-size:13px;color:#e65100;">⚠ ${msg}</div>`;
    if (!Array.isArray(approverData.somuApprovers)) {
      // 旧GASはsomuApproversを返さない → 既存リストから暫定で総務を拾う
      candidates = (approverData.selectableApprovers || []).filter(a => (a.dept || '').includes('総務'));
      if (!candidates.length) return warn('承認者候補を取得できませんでした。GASの再デプロイが必要な可能性があります（管理者にご連絡ください）。');
    } else {
      candidates = approverData.somuApprovers.slice();
      if (!candidates.length) return warn('組織名に「総務」を含む社員が見つかりませんでした。総務担当者にご確認ください。');
    }
  } else {
    candidates = (approverData.selectableApprovers || []).filter(a => a.role && a.role !== '一般');
  }
  const isSelf = id => !approverData.isIppan && id === currentUser.id;
  const options = candidates.map(a =>
    `<option value="${esc(a.id)}">${esc(a.name)}${isSelf(a.id) ? '（自分・自動承認）' : ''}${a.role ? ' [' + esc(a.role) + ']' : ''}</option>`
  ).join('');
  return `<label>承認者 <span style="color:var(--danger)">*</span></label>
    <select id="f-approver-id">
      <option value="">選択してください</option>
      ${options}
    </select>`;
}

// 明細の日付「開始〜終了」を表示用の文字列にする（旧形式のdateも拾う）
function _trDateRange(d) {
  const a = d.dateFrom || d.date || '';
  const b = d.dateTo || '';
  return b && b !== a ? `${a} 〜 ${b}` : a;
}

function updateTransportDateRange() {
  const minDate = document.getElementById('f-tr-period-start')?.value || '';
  const maxDate = document.getElementById('f-tr-period-end')?.value || '';
  document.querySelectorAll('#transport-rows input[type="date"]').forEach(inp => {
    inp.min = minDate;
    inp.max = maxDate;
  });
}

async function submitTransport() {
  const periodStart = document.getElementById('f-tr-period-start').value;
  const periodEnd   = document.getElementById('f-tr-period-end').value;
  const dest        = document.getElementById('f-tr-dest').value.trim();
  if (!periodStart || !periodEnd) throw new Error('日程を入力してください');
  if (!dest) throw new Error('行き先を入力してください');
  const approverEmpId = _getSelectedApproverEmpId();
  const rows = document.getElementById('transport-rows');
  const details = [...rows.querySelectorAll('tr')].map(tr => {
    const g = f => tr.querySelector(`[data-f="${f}"]`)?.value || '';
    return { dateFrom: g('dateFrom'), dateTo: g('dateTo'), facility: g('facility'), from: g('from'), to: g('to'), amount: Number(g('amount') || 0), memo: g('memo') };
  });
  const total = details.reduce((s, d) => s + (isNaN(d.amount) ? 0 : d.amount), 0);
  const content = JSON.stringify({
    periodStart, periodEnd, destination: dest, details, totalAmount: total,
  });
  const applyData = { applicantName: currentUser.name, content, approverEmpId };
  if (editingRecord && editingRecord.appType === 'transport') applyData.id = editingRecord.id;
  await gas({ action: 'saveApply', token: currentToken, appType: 'transport', applyData });
}

let receiptPhotos = [];
let receiptStream = null;

async function startReceiptCamera() {
  try {
    receiptStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('receipt-video');
    video.srcObject = receiptStream;
    video.style.display = 'block';
    document.getElementById('receipt-camera-btn').style.display  = 'none';
    document.getElementById('receipt-capture-btn').style.display = 'inline-flex';
    document.getElementById('receipt-stop-btn').style.display    = 'inline-flex';
  } catch (e) { showToast('カメラを起動できませんでした: ' + e.message); }
}

function stopReceiptCamera() {
  if (receiptStream) { receiptStream.getTracks().forEach(t => t.stop()); receiptStream = null; }
  const video = document.getElementById('receipt-video');
  if (video) { video.srcObject = null; video.style.display = 'none'; }
  document.getElementById('receipt-camera-btn').style.display  = 'inline-flex';
  document.getElementById('receipt-capture-btn').style.display = 'none';
  document.getElementById('receipt-stop-btn').style.display    = 'none';
}

async function captureReceiptPhoto() {
  const video = document.getElementById('receipt-video');
  if (!video || !receiptStream) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const base64 = canvas.toDataURL('image/jpeg');
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const fileName = `receipt_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.jpg`;
  stopReceiptCamera();
  await uploadReceiptBase64(base64, fileName, now);
}

async function uploadReceiptFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const fileName = `receipt_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.jpg`;
    await uploadReceiptBase64(e.target.result, fileName, now);
  };
  reader.readAsDataURL(file);
}

async function uploadReceiptBase64(base64, fileName, now) {
  showToast('アップロード中...');
  try {
    const result = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', PHOTO_GAS_URL);
      xhr.setRequestHeader('Content-Type', 'text/plain');
      xhr.onreadystatechange = () => {
        if (xhr.readyState !== 4) return;
        if (xhr.status === 200) { try { resolve(JSON.parse(xhr.responseText)); } catch { reject(new Error('レスポンス解析失敗')); } }
        else reject(new Error('通信エラー: ' + xhr.status));
      };
      // folder:'expense' で領収書用フォルダに保存（写真GAS側で切り替え。未指定だとアルコール用に入る）
      xhr.send(JSON.stringify({ image: base64, fileName, folder: 'expense' }));
    });
    if (result.url) {
      receiptPhotos.push({ url: result.url, takenAt: now.toISOString().slice(0, 19) + 'Z' });
      renderReceiptPhotos();
      showToast('✅ 領収書を追加しました');
    } else { showToast('⚠️ ' + (result.error || 'アップロード失敗')); }
  } catch (e) { showToast('⚠️ ' + e.message); }
}

function renderReceiptPhotos() {
  const el = document.getElementById('receipt-photo-list');
  if (!el) return;
  el.innerHTML = receiptPhotos.map((p, i) => `
    <div style="position:relative;">

async function submitNew() {
  const type = document.getElementById('new-type').value;
  if (!type) { showToast('申請種別を選択してください'); return; }

  let items = [];
  let warning = '';

  // 届出は確認モーダルまで専用処理（項目がマスタ駆動で可変のため）
  if (type === 'todoke') {
    try { await submitTodoke(); } catch (e) { showToast(e.message); }
    return;
  }

  try {
    if (type === 'leave') {
      const start = document.getElementById('f-leave-start').value;
      const end   = document.getElementById('f-leave-end').value;
      if (!start || !end) throw new Error('日付を入力してください');
      const allDay = document.getElementById('f-leave-allday').checked;
      const startTime = allDay ? '' : document.getElementById('f-leave-start-time').value;
      const endTime   = allDay ? '' : document.getElementById('f-leave-end-time').value;
      if (!allDay && (!startTime || !endTime)) throw new Error('時間を入力してください');
      items = [
        { label: '期間', value: allDay ? '終日' : `${startTime} 〜 ${endTime}` },
        { label: '開始日', value: start },
        { label: '終了日', value: end },
        { label: '備考',   value: document.getElementById('f-leave-note').value || 'なし' },
        { label: '承認者', value: _getApproverDisplayName() },
      ];
      warning = await _checkLeaveOverlap(start, end);
    } else if (type === 'expense') {
      const dest    = document.getElementById('f-exp-dest').value.trim();
      const appDate = document.getElementById('f-exp-appdate').value;
      if (!dest || !appDate) throw new Error('申請日・行先を入力してください');
      items = [
        { label: '申請日',   value: appDate },
        { label: '出張期間', value: `${document.getElementById('f-exp-start').value} 〜 ${document.getElementById('f-exp-end').value}` },
        { label: '行先',     value: dest },
        { label: '合計金額', value: document.getElementById('expense-total-display')?.textContent || '0円' },
      ];
    } else if (type === 'transport') {
      const periodStart = document.getElementById('f-tr-period-start').value;
      const periodEnd   = document.getElementById('f-tr-period-end').value;
      const dest        = document.getElementById('f-tr-dest').value.trim();
      if (!periodStart || !periodEnd) throw new Error('日程を入力してください');
      if (!dest) throw new Error('行き先を入力してください');
      items = [
        { label: '日程',     value: `${periodStart} 〜 ${periodEnd}` },
        { label: '行き先',   value: dest },
        { label: '合計金額', value: document.getElementById('transport-total-display')?.textContent || '0円' },
        { label: '承認者',   value: _getApproverDisplayName() },
      ];
    } else {
      const title = document.getElementById('f-other-title').value.trim();
      if (!title) throw new Error('件名を入力してください');
      const body  = document.getElementById('f-other-body').value || '';
      items = [
        { label: '件名', value: title },
        { label: '内容', value: body.length > 60 ? body.slice(0, 60) + '…' : body || 'なし' },
        { label: '承認者', value: _getApproverDisplayName() },
      ];
    }
  } catch (e) { showToast(e.message); return; }

  _openConfirmModal(typeLabel(type), items, warning, async () => {
    try {
      if (type === 'leave') await submitLeave();
      else if (type === 'expense') await submitExpense();
      else if (type === 'transport') await submitTransport();
      else await submitOther();
      closeModal('modal-confirm');
      closeModal('modal-new');
      showToast(editingRecord ? '更新しました' : '申請しました');
      editingRecord = null;
      loadTab('mine');
    } catch (e) { showToast(e.message); }
  });
}

function _getApproverDisplayName() {
  const sel = document.getElementById('f-approver-id');
  if (!sel || !sel.value) return '（未選択）';
  return sel.options[sel.selectedIndex]?.text || sel.value;
}

function _checkLeaveOverlap(start, end) {
  try {
    const existing = mineRecordsCache.filter(r => r._appType === 'leave');
    const overlapping = existing.filter(r => {
      if (r.applicantId !== currentUser.id) return false;
      if (r.approvalStatus !== '申請中' && r.approvalStatus !== '承認済') return false;
      if (editingRecord && String(r.id) === String(editingRecord.id)) return false;
      try {
        const c = JSON.parse(r.content || '{}');
        return c.start && c.end && c.start <= end && c.end >= start;
      } catch { return false; }
    });
    if (!overlapping.length) return '';
    const dates = overlapping.map(r => {
      try { const c = JSON.parse(r.content); return `${c.start}〜${c.end}（${r.approvalStatus}）`; } catch { return ''; }
    }).join('、');
    return `同じ期間に申請があります：${dates}`;
  } catch { return ''; }
}

function _openConfirmModal(typeLabel, items, warning, onConfirm, opts) {
  document.getElementById('confirm-modal-title').textContent = typeLabel + ' の確認';
  document.getElementById('confirm-modal-body').innerHTML = items.map(item =>
    `<div class="detail-row"><span class="detail-label">${esc(item.label)}</span><span class="detail-val">${esc(item.value)}</span></div>`
  ).join('');
  const warnEl = document.getElementById('confirm-modal-warning');
  if (warning) {
    warnEl.innerHTML = `<div style="padding:10px;background:#fff3e0;border-radius:8px;font-size:13px;color:#e65100;margin-top:4px;">⚠ ${esc(warning)}</div>`;
    warnEl.style.display = '';
    document.getElementById('confirm-modal-btn').textContent = 'それでも申請する';
  } else {
    warnEl.style.display = 'none';
    document.getElementById('confirm-modal-btn').textContent = (opts && opts.btnText) || (editingRecord ? '更新を確定する' : '申請を確定する');
  }
  const btn = document.getElementById('confirm-modal-btn');
  btn.disabled = false;
  const defaultText = (opts && opts.btnText) || (editingRecord ? '更新を確定する' : '申請を確定する');
  btn.onclick = async function() {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '送信中...';
    try { await onConfirm(); } finally {
      if (document.getElementById('modal-confirm').classList.contains('open')) {
        btn.disabled = false;
        btn.textContent = warning ? 'それでも申請する' : defaultText;
      }
    }
  };
  openModal('modal-confirm');
}

// サーバ側 _mergeTodokeFields と同じ規則：同じ key は sort 順で先勝ち
function _todokeMergeFields(names) {
  const picked = (_todokeMaster || []).filter(m => names.indexOf(m.name) >= 0)
                                      .sort((a, b) => a.sort - b.sort);
  const seen = {}, merged = [];
  picked.forEach(m => (m.fields || []).forEach(f => {
    if (!f || !f.key || seen[f.key]) return;
    seen[f.key] = true;
    merged.push(f);
  }));
  return { picked, merged };
}

function onTodokeNamesChange() {
  const names = _todokeSelectedNames();
  const guideEl   = document.getElementById('td-guide');
  const dynEl     = document.getElementById('td-dynamic');
  const commonEl  = document.getElementById('td-common');

  if (!names.length) {
    guideEl.innerHTML = ''; dynEl.innerHTML = '';
    commonEl.style.display = 'none';
    return;
  }
  const { picked, merged } = _todokeMergeFields(names);

  // 期日の目安（マスタの文言をそのまま出す）。複数選んだら全部並べる
  guideEl.innerHTML = picked.filter(m => m.dueGuide).map(m =>
    `<div class="td-guide">🕐 ${esc(m.name)}：${esc(m.dueGuide)}</div>`).join('');

  dynEl.innerHTML = merged.map(f => _todokeFieldHTML(f)).join('');
  commonEl.style.display = '';
