function _todokeFieldHTML(f) {
  const req = f.required ? ' <span style="color:var(--danger);">※必須</span>' : '';
  const lab = `<label>${esc(f.label || f.key)}${req}</label>`;
  const k   = esc(f.key);
  if (f.type === 'select') {
    return lab + `<select data-tdkey="${k}">
      <option value="">選択してください</option>
      ${(f.options || []).map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}
    </select>`;
  }
  if (f.type === 'date')     return lab + `<input type="date" data-tdkey="${k}">`;
  if (f.type === 'textarea') return lab + `<textarea data-tdkey="${k}"></textarea>`;
  if (f.type === 'file') {
    return lab + `<input type="file" multiple data-tdkey="${k}" onchange="onTodokeFileChange(event)">`;
  }
  return lab + `<input type="text" data-tdkey="${k}">`;
}

// 期日が申請日から7日以内なら警告（申請はブロックしない）
function todokeDueCheck() {
  const v  = document.getElementById('td-due').value;
  const el = document.getElementById('td-due-msg');
  if (!v) { el.innerHTML = ''; return ''; }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due   = new Date(v + 'T00:00:00');
  const days  = Math.round((due - today) / 86400000);
  if (days < 0) {
    el.innerHTML = '<div class="td-due-over">指定された日は過ぎています。日付をご確認ください。</div>';
    return '指定された期日は過ぎています';
  }
  if (days < 7) {
    el.innerHTML = '<div class="td-due-soon">受付から完了まで1週間程度かかります。間に合わない可能性があります。</div>';
    return '受付から完了まで1週間程度かかります';
  }
  el.innerHTML = '';
  return '';
}

// ---------- 添付 ----------
function onTodokeFileChange(ev) {
  const input = ev.target;
  const key   = input.getAttribute('data-tdkey') || '';
  const files = Array.from(input.files || []);
  if (!files.length) return;

  const MAX = 10 * 1024 * 1024;   // 1ファイル10MB（サーバ側でも同じ上限で弾く）
  const tooBig = files.filter(f => f.size > MAX);
  if (tooBig.length) {
    showToast(tooBig.map(f => f.name).join('、') + ' が大きすぎます（上限10MB）');
  }
  const ok = files.filter(f => f.size <= MAX);
  if (!ok.length) { input.value = ''; return; }

  let remaining = ok.length;
  ok.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      // data:xxx;base64,yyyy の yyyy だけ渡す
      const base64 = String(reader.result).split(',')[1] || '';
      _todokeFiles.push({ key, name: file.name, mime: file.type, data: base64 });
      if (--remaining === 0) renderTodokeFileList();
    };
    reader.onerror = () => {
      showToast(file.name + ' を読み込めませんでした');
      if (--remaining === 0) renderTodokeFileList();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';   // 同じファイルを選び直せるようにクリア
}

function renderTodokeFileList() {
  const el = document.getElementById('td-file-list');
  if (!el) return;
  if (!_todokeFiles.length) { el.innerHTML = ''; return; }
  el.innerHTML = _todokeFiles.map((f, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg);border-radius:6px;margin-top:6px;font-size:13px;">
      <span style="flex:1;word-break:break-all;">📎 ${esc(f.name)}${f.key ? '（' + esc(f.key) + '）' : ''}</span>
      <button type="button" onclick="removeTodokeFile(${i})" style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:16px;">✕</button>
    </div>`).join('');
}

function removeTodokeFile(i) { _todokeFiles.splice(i, 1); renderTodokeFileList(); }

// ---------- 入力の回収 ----------
// root：探す範囲（省略時は画面全体）。書き直しフォームでは詳細モーダルの中だけを見る。
//   新規申請モーダルにも同じ data-tdkey の入力欄が残っていることがあるため。
// files：添付の入れ物（省略時は新規申請用の _todokeFiles）
// existing：file型で、前に出した添付があるときの名前（書き直し時の必須判定に使う）
function _collectTodokeAnswers(merged, root, files, existing) {
  const scope = root || document;
  const bag   = files || _todokeFiles;
  const prev  = existing || {};
  const answers = {};
  const missing = [];
  merged.forEach(f => {
    let v, filled;
    if (f.type === 'file') {
      v = bag.filter(x => x.key === f.key).map(x => x.name);
      filled = v.length > 0 || (Array.isArray(prev[f.key]) && prev[f.key].length > 0);
    } else {
      const el = scope.querySelector(`[data-tdkey="${f.key}"]`);
      v = el ? String(el.value || '').trim() : '';
      filled = !!v;
    }
    if (f.required && !filled) missing.push(f.label || f.key);
    answers[f.key] = v;
  });
  if (missing.length) throw new Error('未入力の必須項目があります: ' + missing.join('、'));
  return answers;
}

// ---------- 申請 ----------
async function submitTodoke() {
  const names = _todokeSelectedNames();
  if (!names.length) throw new Error('申請名を選んでください');
  const due = document.getElementById('td-due').value;
  if (!due) throw new Error('「何日までに必要か」は必須です');

  const { merged } = _todokeMergeFields(names);
  const answers    = _collectTodokeAnswers(merged);
  const supplement = document.getElementById('td-supplement').value.trim();

  const items = [
    { label: '大分類', value: document.getElementById('td-major').value },
    { label: '申請名', value: names.join('、') },
  ];
  merged.forEach(f => {
    const v = answers[f.key];
    items.push({ label: f.label || f.key, value: Array.isArray(v) ? (v.join('、') || 'なし') : (v || 'なし') });
  });
  items.push({ label: '何日までに必要か', value: due });
  items.push({ label: '補足', value: supplement || 'なし' });
  if (_todokeFiles.length) items.push({ label: '添付', value: _todokeFiles.map(f => f.name).join('、') });

  _openConfirmModal('届出・相談', items, todokeDueCheck(), async () => {
    // 失敗したら必ず画面に出す（_openConfirmModal はエラーを表示しないため。
    // 2026-10-27 テストで、保存失敗時に何も表示されないことが分かった）
    try {
      // 添付は先にSharePointへ上げて、URLだけKintoneにしまうのでここでURLを集める
      const files = [];
      for (const f of _todokeFiles) {
        const res = await gas({ action: 'uploadTodokeFile', token: currentToken,
                                file: { name: f.name, mime: f.mime, data: f.data } });
        if (res && res.url) files.push({ name: res.name || f.name, url: res.url });
      }
      await gas({ action: 'saveTodoke', token: currentToken, todoke: {
        applyNames: names, answers, dueDate: due, supplement, files,
      }});
      closeModal('modal-confirm');
      closeModal('modal-new');
      _todokeFiles = [];
      showToast('届出を提出しました');
      refreshCurrentTab();
    } catch (e) { showToast(e.message); }
  });
}

// ---------- 詳細 ----------
async function openTodokeDetail(id) {
  document.getElementById('detail-body').innerHTML = '<div class="loading"><div class="spinner"></div><div>読み込み中...</div></div>';
  document.getElementById('detail-footer').innerHTML = '';
  document.getElementById('detail-title').textContent = '📨 届出・相談 詳細';
  openModal('modal-detail');
  _todokeMsgFiles = [];
  try {
    // 申請内容とやり取りを同時に取る
    const [r, thread] = await Promise.all([
      gas({ action: 'getTodokeById',   token: currentToken, recordId: id }),
      gas({ action: 'getTodokeThread', token: currentToken, recordId: id }).catch(() => []),
    ]);
    if (!r) throw new Error('届出が見つかりません');
    renderTodokeDetail(r, thread);

    const footer = document.getElementById('detail-footer');
    footer.innerHTML = '';
    // 差し戻し中の本人には「書き直して再提出」（ステータスを戻すだけでなく内容を直してもらう）
    if (r.canResubmit) {
      const btn = document.createElement('button');
      btn.className = 'btn-submit';
      btn.textContent = '内容を書き直して再提出';
      btn.onclick = () => openTodokeResubmit(r);
      footer.appendChild(btn);
    }
    (r.canEditStatus || []).forEach(next => {
      const btn = document.createElement('button');
      // 書類待ち→対応中 は「総務が書類を受け取った」操作（Excel まとめ 5.）
      const isReceive = r.status === '書類待ち' && next === '対応中';
      btn.className = next === '取り下げ' || next === '差し戻し' ? 'btn-danger'
                    : (next === '完了' || isReceive) ? 'btn-success' : 'btn-cancel';
      // 総務が差し戻しを取り消して申請中に戻すとき
      btn.textContent = isReceive ? '書類を受け取った（対応中へ）'
                      : next === '申請中' ? '申請中に戻す' : next + 'にする';
      btn.onclick = () => doTodokeStatus(r.id, next, btn);
      footer.appendChild(btn);
    });
  } catch (e) {
    document.getElementById('detail-body').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><p>${esc(e.message)}</p></div>`;
  }
}

function renderTodokeDetail(r, thread) {
  const row = (l, v) => `<div class="detail-row"><span class="detail-label">${esc(l)}</span><span class="detail-val">${esc(v)}</span></div>`;
  let html = '';
  html += `<div style="margin-bottom:10px;"><span class="badge badge-${esc(r.status)}">${esc(r.status)}</span></div>`;
  html += row('申請者', r.applicantName || r.applicantId);
  html += row('大分類', r.majorType);
  html += row('申請名', (r.applyNames || []).join('、'));
  html += row('何日までに必要か', r.dueDate);

  // 申請時点の定義（schema_snapshot）で描く。マスタを後から変えても表示が壊れない
  (r.schema || []).forEach(f => {
    const v = (r.answers || {})[f.key];
    html += row(f.label || f.key, Array.isArray(v) ? (v.join('、') || 'なし') : (v || 'なし'));
  });

  if (r.supplement) html += row('補足', r.supplement);
  if ((r.files || []).length) {
    // SharePointのURL。開くにはM365の権限が要るので、リンクが漏れても中身は守られる
    html += `<div class="detail-row"><span class="detail-label">添付</span><span class="detail-val">`
          + r.files.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">📎 ${esc(f.name)}</a>`).join('<br>')
          + `</span></div>`;
  }
  if (r.rejectReason) html += row('差し戻し理由', r.rejectReason);
  html += row('申請日時', _tdTime(r.appliedAt));
  if (r.acceptedAt)  html += row('受付日時', _tdTime(r.acceptedAt));
  if (r.completedAt) html += row('完了日時', _tdTime(r.completedAt));

  // --- 書類の提出（書類待ちのときだけ、本人に出す） ---
  if (r.canSubmitDocs) html += _todokeDocsPanelHTML(r, thread);

  // --- やり取り（ステータス変更も同じ時系列に並ぶ） ---
  const closed = ['完了', '取り下げ'].indexOf(r.status) >= 0;
  html += `
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px;">やり取り</div>
      <div id="td-thread" style="max-height:320px;overflow-y:auto;padding:4px 2px;">
        ${_todokeThreadHTML(thread)}
      </div>
      ${_todokeComposerHTML(r.id, closed, r.status)}
    </div>`;

  document.getElementById('detail-body').innerHTML = html;
  const box = document.getElementById('td-thread');
  if (box) box.scrollTop = box.scrollHeight;   // 最新が見えるように下まで送る
}

// 連打防止。押した瞬間にボタンを「処理中...」にして、詳細のボタンを全部無効化する
let _todokeBusy = false;

async function doTodokeStatus(id, next, btn) {
  if (_todokeBusy) return;

  // 確認ダイアログは busy にする前に出す（キャンセルされたらそのまま戻る）
  let reason = '';
  if (next === '差し戻し') {
    reason = prompt('差し戻しの理由を入力してください（必須）') || '';
    if (!reason.trim()) { showToast('理由が必要です'); return; }
  } else if (next === '取り下げ') {
    if (!confirm('この届出を取り下げます。よろしいですか？')) return;
  }

  _todokeBusy = true;
  const footer   = document.getElementById('detail-footer');
  const siblings = footer ? Array.from(footer.querySelectorAll('button')) : [];
  const prevText = btn ? btn.textContent : '';
  siblings.forEach(b => { b.disabled = true; });
  if (btn) btn.textContent = '処理中...';

  try {
    await gas({ action: 'updateTodokeStatus', token: currentToken, recordId: id, status: next, reason });
    closeModal('modal-detail');
    showToast('「' + next + '」にしました');
    refreshCurrentTab();
  } catch (e) {
    showToast(e.message);
    // 失敗したら押し直せるように戻す（成功時はモーダルを閉じるので戻さない）
    siblings.forEach(b => { b.disabled = false; });
    if (btn) btn.textContent = prevText;
  } finally {
    _todokeBusy = false;
  }
}

// ---------- 届出対応タブ（総務） ----------
// 'soumu'＝対応中だけ（既定・軽い）／'soumu_all'＝完了・取り下げも含む（見返すときだけ）
let _todokeListScope = 'soumu';
const TODOKE_CLOSED = ['完了', '取り下げ'];

async function loadTodokeTab() {
  const el = document.getElementById('list-todoke');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><div>読み込み中...</div></div>';
  try {
    const recs = await gas({ action: 'getTodokeList', token: currentToken, scope: _todokeListScope });
    todokeRecordsCache = recs || [];
    // 選択肢は今出ている届出から作る（選択中の値は再読込後も保つ）
    const selMajor = document.getElementById('td-filter-major');
    const keep = selMajor.value;
    const majors = [];
    todokeRecordsCache.forEach(r => { if (r.majorType && majors.indexOf(r.majorType) < 0) majors.push(r.majorType); });
    selMajor.innerHTML = '<option value="">すべての大分類</option>' +
      majors.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    if (majors.indexOf(keep) >= 0) selMajor.value = keep;
    _fillTodokeApplyNameOptions();
    applyTodokeFilter();
  } catch (e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>${esc(e.message)}</p></div>`;
  }
}

// 申請名の選択肢。大分類を選んでいれば、その大分類の申請名だけにする
function _fillTodokeApplyNameOptions() {
  const major = document.getElementById('td-filter-major').value;
  const sel   = document.getElementById('td-filter-apply');
  const keep  = sel.value;
  const names = [];
  todokeRecordsCache
    .filter(r => !major || r.majorType === major)
    .forEach(r => (r.applyNames || []).forEach(n => { if (names.indexOf(n) < 0) names.push(n); }));
  sel.innerHTML = '<option value="">すべての申請名</option>' +
    names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if (names.indexOf(keep) >= 0) sel.value = keep;
}

function onTodokeMajorFilterChange() {
  _fillTodokeApplyNameOptions();
  applyTodokeFilter();
}

function onTodokeDueFilterChange() {
  const isRange = document.getElementById('td-filter-due').value === 'range';
  document.getElementById('td-filter-range').style.display = isRange ? 'flex' : 'none';
  applyTodokeFilter();
}

const TODOKE_SORT_LABEL = {
  'due-asc': '期日が近い順', 'due-desc': '期日が遠い順',
  'applied-desc': '申請日が新しい順', 'applied-asc': '申請日が古い順',
};

function applyTodokeFilter() {
  const major   = document.getElementById('td-filter-major').value;
  const apply   = document.getElementById('td-filter-apply').value;
  const status  = document.getElementById('td-filter-status').value;
  const name    = document.getElementById('td-filter-name').value.trim();
  const dueMode = document.getElementById('td-filter-due').value;
  const from    = document.getElementById('td-filter-from').value;
  const to      = document.getElementById('td-filter-to').value;
  const sort    = document.getElementById('td-sort').value || 'due-asc';

  // 完了・取り下げを見返すときは、過去分を含めて取り直す（一度取れば以後はそのまま使う）
  const wantClosed = TODOKE_CLOSED.indexOf(status) >= 0 || status === '__all';
  if (wantClosed && _todokeListScope !== 'soumu_all') {
    _todokeListScope = 'soumu_all';
    loadTodokeTab();   // 読み込み後にもう一度ここが呼ばれる
    return;
  }

  // 期日の比較は「YYYY-MM-DD」の文字列で行う（時差の影響を受けないように）
  const d0 = new Date(); const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = ymd(d0);
  const in7   = ymd(new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + 7));

  const list = todokeRecordsCache.filter(r => {
    if (major  && r.majorType !== major) return false;
    if (apply  && (r.applyNames || []).indexOf(apply) < 0) return false;
    const closed = TODOKE_CLOSED.indexOf(r.status) >= 0;
    if (!status && closed) return false;                                  // 既定は対応中のものだけ
    if (status && status !== '__all' && r.status !== status) return false;
    if (name && (r.applicantName || '').indexOf(name) < 0) return false;
    const due = r.dueDate || '';
    // 期日超過・7日以内は「まだ終わっていないもの」の話なので、完了・取り下げは除く
    if (dueMode === 'over'  && (closed || !(due && due < today))) return false;
    if (dueMode === 'week'  && (closed || !(due && due <= in7)))  return false;
    if (dueMode === 'range') {
      if (from && !(due && due >= from)) return false;
      if (to   && !(due && due <= to))   return false;
    }
    return true;
  });

  // 期日が空のものは、どの並べ替えでも最後に回す
  const key = r => sort.indexOf('due') === 0 ? (r.dueDate || '') : (r.appliedAt || '');
  const desc = sort.slice(-4) === 'desc';
  list.sort((a, b) => {
    const ka = key(a), kb = key(b);
    if (!ka && !kb) return 0;
    if (!ka) return 1;
    if (!kb) return -1;
    return desc ? kb.localeCompare(ka) : ka.localeCompare(kb);
  });

  const activeTotal = todokeRecordsCache.filter(r => TODOKE_CLOSED.indexOf(r.status) < 0).length;
  const totalLabel  = _todokeListScope === 'soumu_all'
    ? `対応中 ${activeTotal} 件・完了／取り下げ ${todokeRecordsCache.length - activeTotal} 件`
    : `全 ${todokeRecordsCache.length} 件`;
  document.getElementById('td-filter-count').textContent =
    `${list.length} 件 / ${totalLabel}（${TODOKE_SORT_LABEL[sort] || ''}）`;
  renderTodokeList(document.getElementById('list-todoke'), list);
}

function clearTodokeFilter() {
  ['td-filter-major', 'td-filter-status', 'td-filter-name', 'td-filter-due', 'td-filter-from', 'td-filter-to']
    .forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('td-sort').value = 'due-asc';
  document.getElementById('td-filter-range').style.display = 'none';
  _fillTodokeApplyNameOptions();
  document.getElementById('td-filter-apply').value = '';
  applyTodokeFilter();
}

function renderTodokeList(el, records) {
  if (!records.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>条件に合う届出はありません</p></div>';
    return;
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  el.innerHTML = records.map(r => {
    let dueNote = '';
    const closed = TODOKE_CLOSED.indexOf(r.status) >= 0;
    if (closed) {
      dueNote = r.completedAt ? `<span style="color:var(--text-sub);">完了 ${esc(_tdTime(r.completedAt).slice(0, 10))}</span>` : '';
    } else if (r.dueDate) {
      const days = Math.round((new Date(r.dueDate + 'T00:00:00') - today) / 86400000);
      dueNote = days < 0  ? `<span style="color:var(--danger);font-weight:700;">期日超過 ${-days}日</span>`
              : days === 0 ? `<span style="color:var(--danger);font-weight:700;">本日が期日</span>`
              : days <= 7  ? `<span style="color:#e65100;font-weight:700;">あと${days}日</span>`
              : `あと${days}日`;
    }
    return `
    <div class="card" onclick="openTodokeDetail('${esc(r.id)}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="card-title">📨 ${esc((r.applyNames || []).join('・'))}</div>
          <div class="card-sub">${esc(r.applicantName || r.applicantId)} ・ ${esc(r.majorType)}</div>
          <div class="card-sub">期日 ${esc(r.dueDate || '—')} ${dueNote}</div>
        </div>
        <span class="badge badge-${esc(r.status)}">${esc(r.status)}</span>
      </div>
    </div>`;
  }).join('');
}


// ===================================================

// ステータス変更もメッセージも同じ時系列に並べる
// ===================================================
let _todokeMsgFiles = [];   // メッセージに添付するファイル {name, mime, data}

function _tdTime(s) { return String(s || '').replace('T', ' ').slice(0, 16); }

function _todokeThreadHTML(thread, closed) {
  if (!thread || !thread.length) {
    return '<div style="padding:12px;color:var(--text-sub);font-size:13px;">やり取りはまだありません。</div>';
  }
  const meId = (currentUser && currentUser.id) || '';

    if (t.kind !== 'message') {

                     font-size:12px;color:var(--text-sub);white-space:pre-wrap;">

        </span></div>`;
    }
    return `<div style="display:flex;flex-direction:column;align-items:${mine ? 'flex-end' : 'flex-start'};margin:10px 0;">
      <div style="font-size:11px;color:var(--text-sub);margin-bottom:2px;">
        ${esc(t.postedName)}（${esc(t.postedRole)}）・${esc(_tdTime(t.postedAt))}
      </div>
      <div style="max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;
                  word-break:break-word;background:${mine ? '#e3f2fd' : 'var(--bg)'};">
        ${esc(t.body)}${files ? '<div style="margin-top:6px;font-size:13px;">' + files + '</div>' : ''}
      </div>
    </div>`;
  }).join('');
}

function _todokeComposerHTML(id, closed, status) {
  if (closed) {
    return `<div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;
                        font-size:13px;color:var(--text-sub);text-align:center;">
      「${esc(status)}」のためメッセージは送れません。新しいご相談は新しく届出を出してください。
    </div>`;
  }
  return `
    <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
      <textarea id="td-msg-body" placeholder="メッセージを入力" style="min-height:70px;"></textarea>
      <input type="file" multiple id="td-msg-file" onchange="onTodokeMsgFileChange(event)" style="margin-top:6px;">
      <div id="td-msg-file-list"></div>
      <button id="td-msg-send" class="btn-submit" style="margin-top:8px;width:100%;"
              onclick="sendTodokeMessage('${esc(id)}', this)">送信</button>
    </div>`;
}

function onTodokeMsgFileChange(ev) {
  const input = ev.target;
  const files = Array.from(input.files || []);
  if (!files.length) return;
  const MAX = 10 * 1024 * 1024;
  const tooBig = files.filter(f => f.size > MAX);
  if (tooBig.length) showToast(tooBig.map(f => f.name).join('、') + ' が大きすぎます（上限10MB）');
  const ok = files.filter(f => f.size <= MAX);
  if (!ok.length) { input.value = ''; return; }

  let remaining = ok.length;
  ok.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      _todokeMsgFiles.push({ name: file.name, mime: file.type,
                             data: String(reader.result).split(',')[1] || '' });
      if (--remaining === 0) renderTodokeMsgFileList();
    };
    reader.onerror = () => {
      showToast(file.name + ' を読み込めませんでした');
      if (--remaining === 0) renderTodokeMsgFileList();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderTodokeMsgFileList() {
  const el = document.getElementById('td-msg-file-list');
  if (!el) return;
  el.innerHTML = _todokeMsgFiles.map((f, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--bg);
                border-radius:6px;margin-top:6px;font-size:13px;">
      <span style="flex:1;word-break:break-all;">📎 ${esc(f.name)}</span>
      <button type="button" onclick="removeTodokeMsgFile(${i})"
              style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:16px;">✕</button>
    </div>`).join('');
}

function removeTodokeMsgFile(i) { _todokeMsgFiles.splice(i, 1); renderTodokeMsgFileList(); }

async function sendTodokeMessage(id, btn) {
  const ta = document.getElementById('td-msg-body');
  const text = ta ? ta.value.trim() : '';
  if (!text && !_todokeMsgFiles.length) { showToast('本文かファイルを入れてください'); return; }
  if (btn.disabled) return;

  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = '送信中...';
  try {
    const files = [];
    for (const f of _todokeMsgFiles) {
      const res = await gas({ action: 'uploadTodokeFile', token: currentToken,
                              file: { name: f.name, mime: f.mime, data: f.data } });
      if (res && res.url) files.push({ name: res.name || f.name, url: res.url });
    }
    await gas({ action: 'postTodokeMessage', token: currentToken, recordId: id, body: text, files });
    _todokeMsgFiles = [];
    if (ta) ta.value = '';
    await reloadTodokeThread(id);
    showToast('送信しました');
  } catch (e) {
    showToast(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = prev;
  }
}

// タイムラインだけ再読み込みする（申請内容は変わらないので作り直さない）
async function reloadTodokeThread(id) {
  const box = document.getElementById('td-thread');
  if (!box) return;
  try {
    const thread = await gas({ action: 'getTodokeThread', token: currentToken, recordId: id });
    box.innerHTML = _todokeThreadHTML(thread);
    renderTodokeMsgFileList();
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.innerHTML = `<div style="padding:12px;color:var(--danger);font-size:13px;">${esc(e.message)}</div>`;
  }
}

function openTodokeResubmit(r) {

  }

  </div>`;
  html += '<div id="td-edit-form">';
  schema.forEach(f => {
    html += _todokeFieldHTML(f);
    if (f.type === 'file') {
      const prev = Array.isArray(ans[f.key]) ? ans[f.key] : [];
      if (prev.length) {
        html += `<div style="font-size:12px;color:var(--text-sub);margin-top:4px;">提出済み：${esc(prev.join('、'))}（追加するときだけ選んでください）</div>`;
      }
    }
  });
  html += `
    <label>何日までに必要か <span style="color:var(--danger);">※必須</span></label>
    <input type="date" id="td-edit-due" value="${esc(r.dueDate || '')}" onchange="_todokeEditDueCheck()">
    <div id="td-edit-due-msg"></div>
    <label>補足（任意）</label>
    <textarea id="td-edit-supplement">${esc(r.supplement || '')}</textarea>
    <label>添付ファイルを追加（任意）</label>
    <input type="file" multiple data-tdkey="">
    <div id="td-edit-file-list"></div>
    <div style="font-size:12px;color:var(--text-sub);margin-top:8px;">※ マイナンバーが写っているものは添付しないでください</div>
  </div>`;
  document.getElementById('detail-body').innerHTML = html;

  // 前の回答を入れておく（file型はブラウザの仕様で入れられないので除く）
  const form = document.getElementById('td-edit-form');
  schema.forEach(f => {
    if (f.type === 'file') return;
    const el = form.querySelector(`[data-tdkey="${f.key}"]`);
    if (el && ans[f.key] != null) el.value = Array.isArray(ans[f.key]) ? ans[f.key].join('、') : ans[f.key];
  });
  // ファイル欄は書き直し用の入れ物に入れる（新規申請用の _todokeFiles と混ざらないように）
  form.querySelectorAll('input[type="file"]').forEach(el => { el.onchange = onTodokeEditFileChange; });
  _todokeEditDueCheck();

  const footer = document.getElementById('detail-footer');
  footer.innerHTML = '';
  const back = document.createElement('button');
  back.className = 'btn-cancel';
  back.textContent = 'やめる';
  back.onclick = () => openTodokeDetail(r.id);
  const send = document.createElement('button');
  send.className = 'btn-submit';
  send.textContent = '再提出する';
  send.onclick = () => submitTodokeResubmit(r, send);
  footer.appendChild(back);
  footer.appendChild(send);
  document.getElementById('detail-body').scrollTop = 0;
}

// 新規申請の todokeDueCheck と同じ基準（7日以内で注意・過去日で警告、ブロックはしない）
function _todokeEditDueCheck() {
  const el  = document.getElementById('td-edit-due');
  const msg = document.getElementById('td-edit-due-msg');
  if (!el || !msg) return '';
  const v = el.value;
  if (!v) { msg.innerHTML = ''; return ''; }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days  = Math.round((new Date(v + 'T00:00:00') - today) / 86400000);
  if (days < 0) {
    msg.innerHTML = '<div class="td-due-over">指定された日は過ぎています。日付をご確認ください。</div>';
    return '指定された期日は過ぎています';
  }
  if (days < 7) {
    msg.innerHTML = '<div class="td-due-soon">受付から完了まで1週間程度かかります。間に合わない可能性があります。</div>';
    return '受付から完了まで1週間程度かかります';
  }
  msg.innerHTML = '';
  return '';
}

function onTodokeEditFileChange(ev) {
  const input = ev.target;
  const key   = input.getAttribute('data-tdkey') || '';
  const files = Array.from(input.files || []);
  if (!files.length) return;
  const MAX = 10 * 1024 * 1024;
  const tooBig = files.filter(f => f.size > MAX);
  if (tooBig.length) showToast(tooBig.map(f => f.name).join('、') + ' が大きすぎます（上限10MB）');
  const ok = files.filter(f => f.size <= MAX);
  if (!ok.length) { input.value = ''; return; }

  let remaining = ok.length;
  ok.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      _todokeEditFiles.push({ key, name: file.name, mime: file.type,
                              data: String(reader.result).split(',')[1] || '' });
      if (--remaining === 0) renderTodokeEditFileList();
    };
    reader.onerror = () => {
      showToast(file.name + ' を読み込めませんでした');
      if (--remaining === 0) renderTodokeEditFileList();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderTodokeEditFileList() {
  const el = document.getElementById('td-edit-file-list');
  if (!el) return;
  el.innerHTML = _todokeEditFiles.map((f, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--bg);
                border-radius:6px;margin-top:6px;font-size:13px;">
      <span style="flex:1;word-break:break-all;">📎 ${esc(f.name)}</span>
      <button type="button" onclick="removeTodokeEditFile(${i})"
              style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:16px;">✕</button>
    </div>`).join('');
}

function removeTodokeEditFile(i) { _todokeEditFiles.splice(i, 1); renderTodokeEditFileList(); }

async function submitTodokeResubmit(r, btn) {
  if (btn.disabled) return;
  const form = document.getElementById('td-edit-form');
  const due  = document.getElementById('td-edit-due').value;
  let answers;
  try {
    if (!due) throw new Error('「何日までに必要か」は必須です');
    // 前に出した添付も必須判定に数える（追加しなければ前のままでよい）
    answers = _collectTodokeAnswers(r.schema || [], form, _todokeEditFiles, r.answers || {});
  } catch (e) { showToast(e.message); return; }
  const supplement = document.getElementById('td-edit-supplement').value.trim();
  const warn = _todokeEditDueCheck();
  if (warn && !confirm(warn + '\nこのまま再提出しますか？')) return;

  const footer   = document.getElementById('detail-footer');
  const siblings = Array.from(footer.querySelectorAll('button'));
  siblings.forEach(b => { b.disabled = true; });
  btn.textContent = '送信中...';
  try {
    const files = [];
    for (const f of _todokeEditFiles) {
      const res = await gas({ action: 'uploadTodokeFile', token: currentToken,
                              file: { name: f.name, mime: f.mime, data: f.data } });
      if (res && res.url) files.push({ name: res.name || f.name, url: res.url });
    }
    await gas({ action: 'resubmitTodoke', token: currentToken, recordId: r.id,
                todoke: { answers, dueDate: due, supplement, files } });
    _todokeEditFiles = [];
    showToast('書き直して再提出しました');
    refreshCurrentTab();
    openTodokeDetail(r.id);   // 直した内容と、やり取りに残った変更履歴を見せる
  } catch (e) {
    showToast(e.message);
    siblings.forEach(b => { b.disabled = false; });
    btn.textContent = '再提出する';
  }
}


// ===================================================
// 書類の提出方法（2026-10-27）
// Excel まとめ 4.「社員がHALOで書類を出す（自宅からでも）か手渡しするか選択する」
// 書類待ちのときだけ本人に出す。ステータスは変えない（受け取りは総務が「書類待ち→対応中」）。
// ===================================================
let _todokeDocFiles = [];   // HALOで提出する書類 {name, mime, data}

const TODOKE_DOC_MARKS = ['📎 書類をHALOで提出しました', '🤝 書類は手渡しで提出します'];

// 直近で「書類待ち」になってから、本人が提出方法を連絡済みか（やり取りから判定）
function _todokeDocsAlreadySent(r, thread) {
  let since = -1;
  (thread || []).forEach((t, i) => {
    if (t.kind === 'status_change' && String(t.body || '').indexOf('→ 書類待ち') >= 0) since = i;
  });
  return (thread || []).some((t, i) => i > since && t.kind === 'message'
    && String(t.postedBy) === String(r.applicantId)
    && TODOKE_DOC_MARKS.some(m => String(t.body || '').indexOf(m) === 0));
}

function _todokeDocsPanelHTML(r, thread) {
  _todokeDocFiles = [];
  const sent = _todokeDocsAlreadySent(r, thread);
  const head = sent
    ? `<div style="font-weight:700;font-size:14px;color:#2e7d32;">✅ 提出の連絡は済んでいます</div>
       <div style="font-size:12px;color:var(--text-sub);margin:4px 0 8px;">総務の受け取りを待っています。追加で出すものがあれば、もう一度連絡できます。</div>`
    : `<div style="font-weight:700;font-size:14px;color:#e65100;">📄 書類の提出をお願いします</div>
       <div style="font-size:12px;color:var(--text-sub);margin:4px 0 8px;">出し方を選んでください。何を出すかは下の「やり取り」で総務から連絡があります。</div>`;
  return `
  <div id="td-docs" style="margin-top:14px;padding:12px;border-radius:10px;
       border:2px solid ${sent ? '#a5d6a7' : '#ffcc80'};background:${sent ? '#f1f8e9' : '#fff8e1'};">
    ${head}
    <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin:4px 0;cursor:pointer;">
      <input type="radio" name="td-doc-method" value="halo" onchange="onTodokeDocMethodChange()"> HALOで提出する（ファイルを添付）
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin:4px 0;cursor:pointer;">
      <input type="radio" name="td-doc-method" value="hand" onchange="onTodokeDocMethodChange()"> 手渡しする
    </label>
    <div id="td-doc-file-wrap" style="display:none;">
      <input type="file" multiple onchange="onTodokeDocFileChange(event)" style="margin-top:6px;">
      <div id="td-doc-file-list"></div>
    </div>
    <textarea id="td-doc-note" placeholder="メモ（任意）　例：○日に総務へ持っていきます" style="min-height:56px;margin-top:6px;"></textarea>
    <button class="btn-submit" style="margin-top:8px;width:100%;"
            onclick="submitTodokeDocsUI('${esc(r.id)}', this)">提出を連絡する</button>
    <div style="font-size:12px;color:var(--text-sub);margin-top:6px;">※ マイナンバーが写っているものは添付しないでください</div>
  </div>`;
}

function _todokeDocMethod() {
  const el = document.querySelector('input[name="td-doc-method"]:checked');
  return el ? el.value : '';
}

function onTodokeDocMethodChange() {
  const wrap = document.getElementById('td-doc-file-wrap');
  if (wrap) wrap.style.display = _todokeDocMethod() === 'halo' ? '' : 'none';
}

function onTodokeDocFileChange(ev) {
  const input = ev.target;
  const files = Array.from(input.files || []);
  if (!files.length) return;
  const MAX = 10 * 1024 * 1024;
  const tooBig = files.filter(f => f.size > MAX);
  if (tooBig.length) showToast(tooBig.map(f => f.name).join('、') + ' が大きすぎます（上限10MB）');
  const ok = files.filter(f => f.size <= MAX);
  if (!ok.length) { input.value = ''; return; }

  let remaining = ok.length;
  ok.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      _todokeDocFiles.push({ name: file.name, mime: file.type, data: String(reader.result).split(',')[1] || '' });
      if (--remaining === 0) renderTodokeDocFileList();
    };
    reader.onerror = () => {
      showToast(file.name + ' を読み込めませんでした');
      if (--remaining === 0) renderTodokeDocFileList();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderTodokeDocFileList() {
  const el = document.getElementById('td-doc-file-list');
  if (!el) return;
  el.innerHTML = _todokeDocFiles.map((f, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:#fff;
                border-radius:6px;margin-top:6px;font-size:13px;">
      <span style="flex:1;word-break:break-all;">📎 ${esc(f.name)}</span>
      <button type="button" onclick="removeTodokeDocFile(${i})"
              style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:16px;">✕</button>
    </div>`).join('');
}

function removeTodokeDocFile(i) { _todokeDocFiles.splice(i, 1); renderTodokeDocFileList(); }

async function submitTodokeDocsUI(id, btn) {
  if (btn.disabled) return;
  const method = _todokeDocMethod();
  if (!method) { showToast('HALOで提出するか、手渡しするかを選んでください'); return; }
  if (method === 'halo' && !_todokeDocFiles.length) { showToast('提出するファイルを添付してください'); return; }
  const note = (document.getElementById('td-doc-note').value || '').trim();

  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = '送信中...';
  try {
    const files = [];
    if (method === 'halo') {
      for (const f of _todokeDocFiles) {
        const res = await gas({ action: 'uploadTodokeFile', token: currentToken,
                                file: { name: f.name, mime: f.mime, data: f.data } });
        if (res && res.url) files.push({ name: res.name || f.name, url: res.url });
      }
    }
    await gas({ action: 'submitTodokeDocs', token: currentToken, recordId: id,
                todoke: { method, note, files } });
    _todokeDocFiles = [];
    showToast(method === 'halo' ? '書類を提出しました' : '手渡しで出すことを連絡しました');
    refreshCurrentTab();
    openTodokeDetail(id);   // 連絡済みの表示と、やり取りへの記録を見せる
  } catch (e) {
    showToast(e.message);
    btn.disabled = false;
    btn.textContent = prev;
  }
}

</script>
