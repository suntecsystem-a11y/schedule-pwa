<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>社内チャット（停止中）</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
           font-family: 'Segoe UI', 'Noto Sans JP', sans-serif; background: #f0f2f5; color: #333; }
    .box { background: #fff; border-radius: 12px; padding: 32px 28px; max-width: 360px; margin: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.7; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>社内チャットは停止しています</h1>
    <p>作り直しのため、このページは使えなくなりました。<br>ホーム画面に追加している場合は削除してください。</p>
  </div>
  <script>
    // 前のチャットが端末に残したログイン情報・キャッシュ・サービスワーカーを消す
    try {
      sessionStorage.removeItem('chat_user');
      Object.keys(localStorage).filter(k => k.startsWith('chat_')).forEach(k => localStorage.removeItem(k));
    } catch (e) {}
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => {
        if (r.scope.includes('/chat-pwa/')) r.unregister();
      }));
    }
    if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith('chat-')).forEach(k => caches.delete(k)));
  </script>
</body>
</html>
